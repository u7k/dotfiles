#:schema https://yazi-rs.github.io/schemas/theme.json
# Generated by Theme Picker. This file is replaced when a theme is applied.

[app]
overall = { bg = "#111c18" }

[mgr]
cwd = { fg = "#2dd5b7", bold = true }
find_keyword = { fg = "#459451", bold = true, italic = true, underline = true }
find_position = { fg = "#d2689c", bg = "#0c1512", bold = true }
symlink_target = { fg = "#2dd5b7", italic = true }
marker_copied = { fg = "#549e6a", bg = "#549e6a" }
marker_cut = { fg = "#ff5345", bg = "#ff5345" }
marker_marked = { fg = "#2dd5b7", bg = "#2dd5b7" }
marker_selected = { fg = "#459451", bg = "#459451" }
count_copied = { fg = "#111c18", bg = "#549e6a" }
count_cut = { fg = "#f7e8b2", bg = "#ff5345" }
count_selected = { fg = "#111c18", bg = "#459451" }
border_style = { fg = "#53685b" }

[tabs]
active = { fg = "#111c18", bg = "#509475", bold = true }
inactive = { fg = "#c1c497", bg = "#0c1512" }

[mode]
normal_main = { fg = "#111c18", bg = "#509475", bold = true }
normal_alt = { fg = "#509475", bg = "#0c1512" }
select_main = { fg = "#111c18", bg = "#d2689c", bold = true }
select_alt = { fg = "#d2689c", bg = "#0c1512" }
unset_main = { fg = "#111c18", bg = "#ff5345", bold = true }
unset_alt = { fg = "#ff5345", bg = "#0c1512" }

[status]
overall = { fg = "#c1c497", bg = "#111c18" }
perm_sep = { fg = "#53685b" }
perm_type = { fg = "#549e6a" }
perm_read = { fg = "#459451" }
perm_write = { fg = "#ff5345" }
perm_exec = { fg = "#2dd5b7" }
progress_label = { fg = "#c1c497", bold = true }
progress_normal = { fg = "#549e6a", bg = "#0c1512" }
progress_error = { fg = "#459451", bg = "#ff5345" }

[which]
border = { fg = "#509475" }
cand = { fg = "#2dd5b7" }
rest = { fg = "#53685b" }
desc = { fg = "#d2689c" }
separator_style = { fg = "#53685b" }

[confirm]
border = { fg = "#509475" }
title = { fg = "#509475", bold = true }
body = { fg = "#c1c497" }
list = { fg = "#c1c497" }
btn_yes = { fg = "#111c18", bg = "#549e6a", bold = true }
btn_no = { fg = "#c1c497", bg = "#0c1512" }

[spot]
border = { fg = "#509475" }
title = { fg = "#509475", bold = true }
tbl_col = { fg = "#2dd5b7" }
tbl_cell = { fg = "#459451", reversed = true }

[notify]
title_info = { fg = "#549e6a" }
title_warn = { fg = "#459451" }
title_error = { fg = "#ff5345" }

[pick]
border = { fg = "#509475" }
active = { fg = "#d2689c", bold = true }
inactive = { fg = "#c1c497" }

[input]
border = { fg = "#509475" }
title = { fg = "#c1c497" }
value = { fg = "#c1c497" }
selected = { fg = "#111c18", bg = "#32473b" }

[cmp]
border = { fg = "#509475" }
active = { fg = "#111c18", bg = "#32473b", bold = true }
inactive = { fg = "#c1c497" }

[tasks]
border = { fg = "#509475" }
title = { fg = "#c1c497" }
hovered = { fg = "#d2689c", bold = true }

[help]
border = { fg = "#509475" }
chord = { fg = "#2dd5b7" }
action = { fg = "#c1c497" }
hovered = { fg = "#111c18", bg = "#32473b", bold = true }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#459451" },
  { mime = "**/{audio,video}/*", fg = "#d2689c" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff5345" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#2dd5b7" },
  { url = "*", is = "orphan", bg = "#ff5345" },
  { url = "*", is = "exec", fg = "#549e6a" },
  { url = "*/", fg = "#509475" },
  { url = "*", fg = "#c1c497" },
]
