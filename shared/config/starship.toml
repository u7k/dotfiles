"$schema" = "https://starship.rs/config-schema.json"

# Warp-like context chips in the same Tokyo Night palette used by both
# terminals. Git modules disappear automatically outside repositories.
format = """\
[](fg:blue)\
$directory\
[](fg:blue bg:surface)\
$git_branch\
$git_status\
$git_state\
[](fg:surface)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

palette = "tokyo_night"
add_newline = true
command_timeout = 1000

[palettes.tokyo_night]
background = "#1a1b26"
foreground = "#a9b1d6"
surface = "#414868"
blue = "#7aa2f7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
purple = "#bb9af7"
cyan = "#0db9d7"

[directory]
format = "[ $path ]($style)"
style = "bold bg:blue fg:background"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = " "
style = "bold bg:surface fg:purple"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bold bg:surface fg:yellow"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = '\\$${count} '
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
format = "[ $state( $progress_current/$progress_total) ]($style)"
style = "bold bg:surface fg:red"

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
format = "[took $duration]($style) "
style = "fg:yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "fg:surface"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold blue) "
